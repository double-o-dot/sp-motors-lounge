<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0a09">
<title>SP Motors 대기실 — 비 오는 날의 집중 공간</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--amber:#f2a33a;--amber2:#ffd28a;--teal:#3fd0b0;--paper:#efe7d6;--ink:#1b1814;--red:#d9503a;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0a09;color:#ece7df;font-family:'Noto Sans KR',system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .8s ease;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{opacity:1;pointer-events:auto}

/* ---------- shared backdrop ---------- */
.backdrop{position:absolute;inset:0;overflow:hidden;background:radial-gradient(60% 50% at 50% 42%,rgba(242,163,58,.16),transparent 70%),linear-gradient(#0d0c0b 0 66%,#1c1814 66% 100%)}
.backdrop::after{content:"";position:absolute;left:0;right:0;top:66%;height:10px;background:repeating-linear-gradient(-45deg,#d9a21b 0 16px,#141210 16px 32px);opacity:.55}
.backdrop .rainline{position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 22px,rgba(160,190,220,.05) 22px 23px);animation:drift 1s linear infinite;mask:linear-gradient(#000 0 60%,transparent 66%);-webkit-mask:linear-gradient(#000 0 60%,transparent 66%)}
@keyframes drift{from{background-position:0 0}to{background-position:-30px 220px}}

/* ---------- kiosk ---------- */
.kiosk{position:relative;width:min(452px,92vw);z-index:2;display:flex;flex-direction:column;align-items:center}
.k-body{width:100%;background:linear-gradient(#2a2724,#1d1b19);border-radius:30px;padding:12px;box-shadow:0 40px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px #000}
.k-screen{background:#141311;border-radius:20px;overflow:hidden;border:1px solid #000}
.k-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.logo{width:30px;height:30px;flex:none}
.brand{font-weight:900;letter-spacing:.02em;font-size:15px}
.brand small{display:block;font-weight:500;font-size:10px;color:#8d867c;letter-spacing:.12em;margin-top:1px}
.k-head .sp{flex:1}
.iconbtn{width:34px;height:34px;border-radius:50%;background:#24221f;display:grid;place-items:center;border:1px solid var(--line);transition:background .2s}
.iconbtn:hover{background:#2f2c28}
.iconbtn svg{width:16px;height:16px}
.k-title{padding:22px 18px 6px;text-align:center}
.k-title h1{font-size:19px;font-weight:700}
.k-title p{font-size:12.5px;color:#9a9286;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:16px 14px 8px}
.tile{aspect-ratio:1/1.08;border-radius:14px;background:#1e1c1a;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#cfc7ba;transition:transform .18s,background .2s,color .2s,box-shadow .2s;padding:6px 4px}
.tile svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:11.5px;font-weight:700;line-height:1.2;text-align:center;word-break:keep-all}
.tile i{font-style:normal;font-size:10px;color:#7f786e;font-family:'JetBrains Mono',monospace}
.tile:hover{transform:translateY(-2px);background:#262320}
.tile.sel{background:var(--amber);color:#1a1209;box-shadow:0 8px 24px rgba(242,163,58,.35)}
.tile.sel i{color:#4a3415}
.k-foot{padding:10px 14px 16px}
.cta{width:100%;height:50px;border-radius:999px;background:#f3eee6;color:#16130f;font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,filter .2s}
.cta:hover{filter:brightness(1.05)}.cta:active{transform:scale(.98)}
.cta svg{width:16px;height:16px}
.k-meta{display:flex;justify-content:space-between;padding:8px 6px 0;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:#6d665d;letter-spacing:.1em}
.k-meta .dots i{display:inline-block;width:5px;height:5px;border-radius:50%;background:#555;margin-left:4px}
.k-meta .dots i:first-child{background:var(--teal);box-shadow:0 0 6px var(--teal)}
.stand{width:46%;height:26px;background:linear-gradient(#26231f,#141210);border-radius:0 0 12px 12px;margin-top:-2px;position:relative;box-shadow:0 18px 30px rgba(0,0,0,.5)}
.stand::after{content:"";position:absolute;left:12%;right:12%;top:9px;height:4px;border-radius:4px;background:#0a0908}
.credit{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:10.5px;color:#5f594f;letter-spacing:.04em;z-index:2}

/* ---------- work order ---------- */
.order{position:relative;z-index:2;width:min(400px,90vw);max-height:92vh;overflow:auto;scrollbar-width:none}
.order::-webkit-scrollbar{display:none}
.clip{width:120px;height:34px;margin:0 auto -14px;background:linear-gradient(#bfc3c6,#80868b);border-radius:8px 8px 4px 4px;position:relative;z-index:3;box-shadow:0 4px 10px rgba(0,0,0,.5)}
.clip::after{content:"";position:absolute;left:44px;right:44px;top:7px;height:10px;border-radius:6px;background:#3d4144}
.paper{background:var(--paper);color:var(--ink);border-radius:6px;padding:30px 22px 20px;box-shadow:0 30px 60px rgba(0,0,0,.6);position:relative;transform:translateY(30px);opacity:0;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .5s}
.screen.on .paper{transform:none;opacity:1}
.paper::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 27px,rgba(60,90,140,.07) 27px 28px);border-radius:6px;pointer-events:none}
.p-head{text-align:center}
.p-head .row{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:17px}
.p-head .row svg{width:22px;height:22px}
.p-head p{font-size:11px;color:#6d6455;margin-top:2px;letter-spacing:.2em}
.mono{font-family:'JetBrains Mono',monospace}
.meta{display:flex;justify-content:space-between;font-size:10.5px;margin-top:14px;color:#4b443a}
.bar{height:22px;margin:8px auto 2px;width:150px;background:repeating-linear-gradient(90deg,#1b1814 0 2px,transparent 2px 4px,#1b1814 4px 5px,transparent 5px 8px,#1b1814 8px 11px,transparent 11px 12px)}
.dash{border-top:1.5px dashed #b8ac97;margin:12px 0}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;margin:7px 0}
.field span{color:#6d6455}
.plate{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;width:140px;text-align:center;padding:6px 8px;border:2px solid #1b1814;border-radius:6px;background:#fffdf7;color:#1b1814;outline:none;user-select:text;-webkit-user-select:text}
.plate:focus{border-color:var(--amber)}
.job{display:flex;align-items:center;gap:8px;font-weight:700}
.job svg{width:20px;height:20px;fill:none;stroke:#1b1814;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.sec{font-size:11px;font-weight:700;color:#6d6455;margin:14px 0 6px;letter-spacing:.05em}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.chip{height:40px;border-radius:10px;background:#2a2622;color:#efe7d6;font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s}
.chip.sel{background:#fffdf7;color:#1b1814;box-shadow:inset 0 0 0 2px #1b1814;font-weight:700}
.chip input{width:46px;background:transparent;border:0;color:inherit;text-align:center;font-weight:700;outline:none;user-select:text;-webkit-user-select:text}
.sum{text-align:center;font-size:12px;color:#4b443a;margin-top:14px}
.sum b{font-size:16px;display:block;color:#1b1814;margin-top:2px}
.stamp{position:absolute;right:18px;top:92px;width:78px;height:78px;border:3px solid var(--red);color:var(--red);border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:13px;transform:rotate(-14deg) scale(1.6);opacity:0;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s;text-align:center;line-height:1.15}
.stamp.on{opacity:.85;transform:rotate(-14deg) scale(1)}
.go{margin-top:14px;width:100%;height:50px;border-radius:12px;background:var(--teal);color:#06231d;font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 20px rgba(63,208,176,.3);transition:transform .15s,filter .2s}
.go:hover{filter:brightness(1.05)}.go:active{transform:scale(.98)}
.go svg{width:16px;height:16px}
.back{display:flex;align-items:center;gap:6px;font-size:12px;color:#8d867c;margin:0 auto 10px;width:max-content}
.back svg{width:14px;height:14px}
.torn{height:12px;background:linear-gradient(-45deg,transparent 6px,var(--paper) 0) 0 0/12px 12px repeat-x,linear-gradient(45deg,transparent 6px,var(--paper) 0) 0 0/12px 12px repeat-x;transform:rotate(180deg);margin-top:-1px}

/* ---------- scene ---------- */
#scene{background:#0b0a09}
#scene svg.room{position:absolute;inset:0;width:100%;height:100%;display:block}
.rain line{stroke:rgba(190,215,240,.55);stroke-width:1.4;stroke-linecap:round;animation:fall linear infinite}
@keyframes fall{from{transform:translate(0,-470px)}to{transform:translate(-46px,470px)}}
.splash{fill:none;stroke:rgba(190,215,240,.5);stroke-width:1;transform-box:fill-box;transform-origin:center;animation:splash 1s ease-out infinite;opacity:0}
@keyframes splash{0%{transform:scale(.2);opacity:.9}100%{transform:scale(1.8);opacity:0}}
.flick{animation:flick 7s infinite}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.4}94%{opacity:1}95.5%{opacity:.6}96%{opacity:1}}
.neon{animation:neon 9s infinite}
@keyframes neon{0%,40%,44%,100%{opacity:1}41%{opacity:.55}43%{opacity:.85}}
.steam path{fill:none;stroke:rgba(255,255,255,.35);stroke-width:3;stroke-linecap:round;animation:steam 3.2s ease-in-out infinite;opacity:0}
.steam path:nth-child(2){animation-delay:1.1s}.steam path:nth-child(3){animation-delay:2.1s}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}30%{opacity:.8}100%{opacity:0;transform:translateY(-26px)}}
#carLift{transition:transform 2.6s cubic-bezier(.45,0,.25,1)}
.lowered #carLift{transform:translateY(140px)}
#mechWork,#mechBreak{transition:opacity .9s}
.lowered #mechWork{opacity:0}
#mechBreak{opacity:0}
.lowered #mechBreak{opacity:1}
#arm{transform-box:fill-box;transform-origin:10% 92%}
.working #arm{animation:wrench .32s ease-in-out infinite alternate}
@keyframes wrench{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
#catBody{transform-box:fill-box;transform-origin:center bottom;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.05)}}
#catTail{transform-box:fill-box;transform-origin:0% 50%;animation:tail 6s ease-in-out infinite}
@keyframes tail{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-14deg)}}
.headlights{opacity:0}
.headlights.go{animation:pass 5.5s linear}
@keyframes pass{0%{opacity:0;transform:translateX(-420px)}10%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translateX(420px)}}
.drop{fill:rgba(220,235,255,.35)}
.drip{animation:drip linear infinite}
@keyframes drip{0%{transform:translateY(0)}100%{transform:translateY(340px)}}

/* player */
.panel{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(470px,93vw);background:rgba(16,15,14,.72);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:12px 16px 14px;box-shadow:0 20px 50px rgba(0,0,0,.5);z-index:5}
.p-top{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#a59d91}
.mode{display:flex;align-items:center;gap:6px;letter-spacing:.04em}
.mode i{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal)}
.rest .mode i{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.paused .mode i{background:#777;box-shadow:none}
.time{font-family:'JetBrains Mono',monospace;font-size:46px;font-weight:700;text-align:center;letter-spacing:-.02em;line-height:1.05;margin:2px 0 6px;font-variant-numeric:tabular-nums}
.paused .time{opacity:.55}
.prog{height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:10px}
.prog i{display:block;height:100%;width:0;background:var(--teal);transition:width .3s linear}
.rest .prog i{background:var(--amber)}
.p-bot{display:flex;align-items:center;gap:10px}
.np{flex:1;min-width:0}
.np small{display:block;font-size:10px;color:#857d72;letter-spacing:.06em}
.np b{display:block;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#d9d2c6;transition:background .2s}
.ctl:hover{background:rgba(255,255,255,.07)}
.ctl svg{width:18px;height:18px}
.play{width:48px;height:48px;background:var(--teal);color:#06231d}
.play:hover{background:var(--teal);filter:brightness(1.08)}
.rest .play{background:var(--amber);color:#2a1a05}
.play svg{width:20px;height:20px}
.ctl.on{color:var(--amber)}
.mixer{position:absolute;left:0;right:0;bottom:calc(100% + 10px);background:rgba(16,15,14,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:14px 16px 8px;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .25s,transform .25s}
.mixer.on{opacity:1;transform:none;pointer-events:auto}
.mixer h4{font-size:11px;color:#a59d91;font-weight:500;margin-bottom:8px;letter-spacing:.06em}
.mrow{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:12.5px}
.mrow span{width:86px;flex:none;color:#d9d2c6}
.mrow input{flex:1;accent-color:var(--amber);height:20px}
.confirm{position:absolute;inset:0;background:rgba(12,11,10,.94);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;opacity:0;pointer-events:none;transition:opacity .2s}
.confirm.on{opacity:1;pointer-events:auto}
.confirm p{font-size:14px}
.confirm div{display:flex;gap:8px}
.confirm button{height:38px;padding:0 18px;border-radius:999px;background:#2a2724;font-size:13px}
.confirm button.y{background:var(--red);color:#fff}
.toast{position:absolute;top:calc(18px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-20px);background:rgba(16,15,14,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .4s,transform .4s;z-index:6;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hint{position:absolute;top:calc(18px + env(safe-area-inset-top));right:18px;z-index:5;display:flex;gap:8px}
.hint .iconbtn{background:rgba(16,15,14,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
@media (max-width:520px){.toast{white-space:normal;word-break:keep-all;text-align:center;max-width:calc(100vw - 120px);border-radius:16px;font-size:12px}.time{font-size:40px}.grid{gap:6px;padding:14px 10px 6px}.tile b{font-size:10.5px}.tile svg{width:26px;height:26px}}
</style>
</head>
<body>

<!-- ===================== SVG defs (icons) ===================== -->

  <defs>
    <symbol id="i-logo" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#f2a33a"/><circle cx="20" cy="20" r="13.5" fill="none" stroke="#1a1209" stroke-width="1.6" stroke-dasharray="3 2.2"/><text x="20" y="25" text-anchor="middle" font-family="Noto Sans KR,sans-serif" font-weight="900" font-size="14" fill="#1a1209">SP</text></symbol>

    <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>

<script>
/* ================= data ================= */
const SERVICES=[
  {id:'oil',name:'엔진오일 교환',min:25,icon:'i-oil'},
  {id:'tire',name:'타이어 교체',min:30,icon:'i-tire'},
  {id:'brake',name:'브레이크 점검',min:45,icon:'i-brake'},
  {id:'batt',name:'배터리 교체',min:15,icon:'i-batt'},
  {id:'ac',name:'에어컨 점검',min:25,icon:'i-ac'},
  {id:'wash',name:'실내 세차',min:20,icon:'i-wash'},
  {id:'wiper',name:'와이퍼 교체',min:10,icon:'i-wiper'},
  {id:'full',name:'종합 점검',min:50,icon:'i-full'}
];
const MECHS=['박 반장','김 실장','이 기사','최 팀장','정 반장'];
const TRACKS=[
  {title:'Waiting Room Waltz',file:'music/Waiting_Room_Waltz.mp3'},
  {title:'Midnight Oil Change',file:'music/Midnight_Oil_Change.mp3'},
  {title:'Shelter Under Tin',file:'music/Shelter_Under_Tin.mp3'},
  {title:'Sheltered Workbench',file:'music/Sheltered_Workbench.mp3'}
];

/* ================= state ================= */
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem('spm_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('spm_'+k,JSON.stringify(v))}catch(e){}}};
const S={svc:store.get('svc',0),focus:25,rest:store.get('rest',5),plate:store.get('plate',''),mech:MECHS[Math.floor(Math.random()*MECHS.length)],
  muted:store.get('muted',false),vol:Object.assign({music:70,rain:55,shop:35,car:40,heater:20},store.get('vol',{})),
  mode:'focus',session:1,total:0,endAt:0,remain:0,running:false,track:0,woNo:String(Math.floor(1000+Math.random()*8999))};
S.focus=store.get('focus',SERVICES[S.svc].min);

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}

/* ================= kiosk ================= */
const grid=$('#grid');
SERVICES.forEach((s,i)=>{const b=document.createElement('button');b.className='tile'+(i===S.svc?' sel':'');
  b.innerHTML=`<svg><use href="#${s.icon}"/></svg><b>${s.name}</b><i>${s.min}분</i>`;
  b.onclick=()=>{S.svc=i;S.focus=s.min;grid.querySelectorAll('.tile').forEach((t,j)=>t.classList.toggle('sel',j===i));uiBeep(660+i*40)};grid.appendChild(b)});
function setSoundIcon(){$('#kSound use').setAttribute('href',S.muted?'#i-mute':'#i-vol')}
setSoundIcon();
$('#kSound').onclick=()=>{S.muted=!S.muted;store.set('muted',S.muted);setSoundIcon();if(A.ctx)A.master.gain.setTargetAtTime(S.muted?0:1,A.ctx.currentTime,.05);audio.muted=S.muted;uiBeep(880)};
$('#toOrder').onclick=()=>{uiBeep(990);buildOrder();show('order')};
$('#backK').onclick=()=>{uiBeep(520);show('kiosk')};

/* ================= work order ================= */
function fmtDate(d){const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}
function buildOrder(){
  const s=SERVICES[S.svc];
  $('#woNo').textContent=S.woNo;$('#woDate').textContent=fmtDate(new Date());
  $('#woJob').innerHTML=`<svg><use href="#${s.icon}"/></svg>${s.name}`;
  $('#woMech').textContent=S.mech;$('#plate').value=S.plate;$('#stamp').classList.remove('on');
  chips('#fChips',[s.min,s.min===25?50:25],'focus',[1,180]);
  chips('#rChips',[5,10],'rest',[1,60]);
  updSum();
}
function chips(sel,opts,key,range){
  const box=$(sel);box.innerHTML='';
  opts=[...new Set(opts)];
  const custom=!opts.includes(S[key]);
  opts.forEach(v=>{const b=document.createElement('button');b.className='chip'+(S[key]===v?' sel':'');b.textContent=v+'분';
    b.onclick=()=>{S[key]=v;uiBeep(720);chips(sel,opts,key,range);updSum()};box.appendChild(b)});
  const c=document.createElement('label');c.className='chip'+(custom?' sel':'');
  c.innerHTML=`<input type="number" inputmode="numeric" min="${range[0]}" max="${range[1]}" placeholder="직접" value="${custom?S[key]:''}">${custom?'분':''}`;
  const inp=c.querySelector('input');
  inp.oninput=()=>{const v=Math.max(range[0],Math.min(range[1],parseInt(inp.value)||0));if(v){S[key]=v;box.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');updSum()}};
  box.appendChild(c);
}
function updSum(){$('#woSum').textContent=`집중 ${S.focus}분 · 휴식 ${S.rest}분`}
$('#plate').oninput=e=>{S.plate=e.target.value.trim()};
$('#toRoom').onclick=()=>{
  if(!S.plate)S.plate=['12가','34나','56다','78라'][Math.floor(Math.random()*4)]+' '+String(Math.floor(1000+Math.random()*8999));
  store.set('svc',S.svc);store.set('focus',S.focus);store.set('rest',S.rest);store.set('plate',S.plate);
  $('#stamp').classList.add('on');initAudio();stampSound();
  setTimeout(enterRoom,750);
};

/* ================= scene build ================= */
const NS='http://www.w3.org/2000/svg';
function rain(gid,x0,x1,y0,y1,n){const g=document.getElementById(gid);
  for(let i=0;i<n;i++){const l=document.createElementNS(NS,'line');const x=x0+Math.random()*(x1-x0+60),y=y0+Math.random()*(y1-y0);const len=12+Math.random()*16;
    l.setAttribute('x1',x);l.setAttribute('y1',y);l.setAttribute('x2',x-len*.1);l.setAttribute('y2',y+len);
    l.style.animationDuration=(.45+Math.random()*.35)+'s';l.style.animationDelay=(-Math.random()*1)+'s';l.style.opacity=.35+Math.random()*.6;g.appendChild(l)}}
function splashes(gid,x0,x1,y0,y1,n){const g=document.getElementById(gid);for(let i=0;i<n;i++){const e=document.createElementNS(NS,'ellipse');e.setAttribute('cx',x0+Math.random()*(x1-x0));e.setAttribute('cy',y0+Math.random()*(y1-y0));e.setAttribute('rx',6);e.setAttribute('ry',2);e.setAttribute('class','splash');e.style.animationDelay=(-Math.random())+'s';e.style.animationDuration=(.7+Math.random()*.6)+'s';g.appendChild(e)}}
function drops(){const g=document.getElementById('drops');for(let i=0;i<34;i++){const c=document.createElementNS(NS,'circle');c.setAttribute('cx',1316+Math.random()*228);c.setAttribute('cy',164+Math.random()*320);c.setAttribute('r',1+Math.random()*2.6);c.setAttribute('class','drop');if(Math.random()<.25){c.classList.add('drip');c.style.animationDuration=(6+Math.random()*10)+'s';c.style.animationDelay=(-Math.random()*10)+'s'}g.appendChild(c)}}
rain('rainDoor',580,870,214,565,110);rain('rainWin',1312,1548,160,490,80);splashes('splashDoor',585,865,505,560,14);drops();
function fitView(){const r=innerWidth/innerHeight;const svg=$('#room');const w=Math.min(1600,900*r);const fc=r<.8?520:640;const l=Math.max(0,Math.min(1600-w,fc-w/2));svg.setAttribute('viewBox',w>=1600?'0 0 1600 900':`${l.toFixed(0)} 0 ${w.toFixed(0)} 900`)}
addEventListener('resize',fitView);fitView();
function clock(){const d=new Date();const h=d.getHours()%12,m=d.getMinutes(),s=d.getSeconds();
  $('#hH').setAttribute('transform',`rotate(${h*30+m*.5})`);$('#hM').setAttribute('transform',`rotate(${m*6+s*.1})`);$('#hS').setAttribute('transform',`rotate(${s*6})`)}
setInterval(clock,1000);clock();

/* ================= room / timer ================= */
const room=$('#room'),panel=$('#panel');
function enterRoom(){
  const s=SERVICES[S.svc];
  $('#tvPlate').textContent=S.plate;$('#tvJob').textContent=`${s.name} · ${S.mech}`;$('#keyTag').textContent=S.woNo;
  show('scene');S.session=1;startPhase('focus');
  startMusic();toast(`${S.mech}님이 차를 리프트에 올렸어요. 작업 시작!`);
}
function startPhase(mode){
  S.mode=mode;S.total=(mode==='focus'?S.focus:S.rest)*60;S.endAt=Date.now()+S.total*1000;S.running=true;
  room.classList.toggle('lowered',mode==='rest');
  panel.classList.toggle('rest',mode==='rest');panel.classList.remove('paused');setPlayIcon();render();
}
function remaining(){return S.running?Math.max(0,(S.endAt-Date.now())/1000):S.remain}
function render(){
  const r=remaining();const m=Math.floor(Math.ceil(r)/60),s=Math.ceil(r)%60;const t=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  $('#time').textContent=t;
  const p=S.total?1-r/S.total:0;$('#progBar').style.width=(p*100)+'%';
  const isF=S.mode==='focus';
  $('#modeTxt').textContent=(S.running?(isF?'작업 중':'커피 타임'):'일시 정지')+` · ${S.session}회차`;
  $('#tvSess').textContent=S.session+'회차';
  $('#tvStatus').textContent=isF?(S.running?'작업 중':'작업 대기'):'정비사 휴식 중';
  $('#tvStatus').setAttribute('fill',isF?'#3fd0b0':'#f2a33a');
  $('#tvBar').setAttribute('fill',isF?'#3fd0b0':'#f2a33a');
  $('#tvBar').setAttribute('width',216*p);$('#tvPct').textContent=Math.floor(p*100)+'%';
  room.classList.toggle('working',isF&&S.running);
  if(TRACKS.length&&audio.duration){const f=x=>`${Math.floor(x/60)}:${String(Math.floor(x%60)).padStart(2,'0')}`;$('#radioTxt').textContent=`SP 라디오 · ${f(audio.currentTime)} / ${f(audio.duration)}`}
  if($('#scene').classList.contains('on'))document.title=`${t} · ${isF?'작업 중':'휴식'} — SP Motors`;
}
setInterval(()=>{if(!$('#scene').classList.contains('on'))return;if(S.running&&remaining()<=0)phaseDone();render()},250);
function phaseDone(){
  chime();
  if(S.mode==='focus'){toast(`작업 ${S.session}회차 완료! 커피 한 잔 하세요 · 휴식 ${S.rest}분`);startPhase('rest')}
  else{S.session++;toast(`휴식 끝 — ${S.session}회차 작업 들어갑니다`);startPhase('focus')}
}
function setPlayIcon(){$('#playIcon').setAttribute('href',S.running?'#i-pause':'#i-play')}
$('#playBtn').onclick=()=>{
  if(S.running){S.remain=remaining();S.running=false;audio.pause();suspendAmb(true);panel.classList.add('paused')}
  else{S.endAt=Date.now()+S.remain*1000;S.running=true;if(TRACKS.length)audio.play().catch(()=>{});suspendAmb(false);panel.classList.remove('paused')}
  setPlayIcon();render();
};
$('#nextBtn').onclick=()=>{nextTrack()};
$('#mixBtn').onclick=()=>{$('#mixer').classList.toggle('on');$('#mixBtn').classList.toggle('on')};
$('#endBtn').onclick=()=>$('#confirm').classList.add('on');
$('#cNo').onclick=()=>$('#confirm').classList.remove('on');
$('#cYes').onclick=()=>{$('#confirm').classList.remove('on');S.running=false;audio.pause();suspendAmb(true);document.title='SP Motors 대기실 — 비 오는 날의 집중 공간';room.classList.remove('lowered');show('kiosk')};
$('#fsBtn').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
document.addEventListener('keydown',e=>{if(!$('#scene').classList.contains('on')||e.target.tagName==='INPUT')return;if(e.code==='Space'){e.preventDefault();$('#playBtn').click()}if(e.key==='n')nextTrack()});
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),4200)}

/* ================= music ================= */
const audio=new Audio();audio.preload='auto';audio.muted=S.muted;
S.track=Math.floor(Math.random()*Math.max(1,TRACKS.length));
function loadTrack(i){if(!TRACKS.length){$('#trackTxt').textContent='라디오 꺼짐 · 빗소리만';return}S.track=(i+TRACKS.length)%TRACKS.length;const t=TRACKS[S.track];audio.src=t.file;$('#trackTxt').textContent=t.title;audio.volume=S.vol.music/100}
function startMusic(){loadTrack(S.track);if(TRACKS.length)audio.play().catch(()=>{})}
function nextTrack(){if(!TRACKS.length)return;loadTrack(S.track+1);if(S.running)audio.play().catch(()=>{});toast('♪ '+TRACKS[S.track].title)}
audio.addEventListener('ended',()=>nextTrack());
audio.addEventListener('error',()=>{$('#radioTxt').textContent='SP 라디오 · 신호 없음'});

/* ================= synth ambience ================= */
const A={ctx:null};
function initAudio(){
  if(A.ctx){if(A.ctx.state==='suspended')A.ctx.resume();return}
  const C=new (window.AudioContext||window.webkitAudioContext)();A.ctx=C;
  A.master=C.createGain();A.master.gain.value=S.muted?0:1;A.master.connect(C.destination);
  const len=C.sampleRate*4;
  A.white=C.createBuffer(2,len,C.sampleRate);A.brown=C.createBuffer(2,len,C.sampleRate);
  for(let ch=0;ch<2;ch++){const w=A.white.getChannelData(ch),b=A.brown.getChannelData(ch);let last=0;for(let i=0;i<len;i++){const r=Math.random()*2-1;w[i]=r;last=(last+.02*r)/1.02;b[i]=last*3.5}}
  A.bus={};['rain','shop','car','heater'].forEach(k=>{const g=C.createGain();g.gain.value=busVol(k);g.connect(A.master);A.bus[k]=g});
  // rain bed
  loopNoise(A.white,[['highpass',600],['lowpass',5200]],.22,A.bus.rain);
  loopNoise(A.brown,[['lowpass',500]],.45,A.bus.rain);
  loopNoise(A.white,[['bandpass',1800,.6]],.05,A.bus.rain);
  patter();
  // heater hum
  loopNoise(A.brown,[['lowpass',160]],.9,A.bus.heater);
  const o=C.createOscillator();o.frequency.value=60;const og=C.createGain();og.gain.value=.025;o.connect(og).connect(A.bus.heater);o.start();
  shopLoop();carLoop();
}
function busVol(k){const v=S.vol[k]/100;return v*v*1.4}
function loopNoise(buf,filters,gain,dest){const C=A.ctx;const s=C.createBufferSource();s.buffer=buf;s.loop=true;s.loopStart=Math.random();let n=s;
  filters.forEach(([t,f,q])=>{const fl=C.createBiquadFilter();fl.type=t;fl.frequency.value=f;if(q)fl.Q.value=q;n.connect(fl);n=fl});
  const g=C.createGain();g.gain.value=gain;n.connect(g).connect(dest);s.start(0,Math.random()*3)}
function burst(dest,{at=0,dur=.03,hp=0,lp=0,bp=0,q=1,gain=.2,pan=0,attack=.002}){
  const C=A.ctx,t=C.currentTime+at;const s=C.createBufferSource();s.buffer=A.white;let n=s;
  if(hp){const f=C.createBiquadFilter();f.type='highpass';f.frequency.value=hp;n.connect(f);n=f}
  if(lp){const f=C.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;n.connect(f);n=f}
  if(bp){const f=C.createBiquadFilter();f.type='bandpass';f.frequency.value=bp;f.Q.value=q;n.connect(f);n=f}
  const g=C.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  let out=g;if(C.createStereoPanner){const p=C.createStereoPanner();p.pan.value=pan;g.connect(p);out=p}
  n.connect(g);out.connect(dest);s.start(t,Math.random()*3);s.stop(t+dur+.05)}
function tone(dest,{f,at=0,dur=1,gain=.1,type='sine',pan=0}){const C=A.ctx,t=C.currentTime+at;const o=C.createOscillator();o.type=type;o.frequency.value=f;const g=C.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+dur);let out=g;if(C.createStereoPanner){const p=C.createStereoPanner();p.pan.value=pan;g.connect(p);out=p}o.connect(g);out.connect(dest);o.start(t);o.stop(t+dur+.05)}
function patter(){if(!A.ctx)return;if(!A.paused&&A.ctx.state==='running'){const n=2+Math.floor(Math.random()*4);for(let i=0;i<n;i++)burst(A.bus.rain,{at:Math.random()*.08,dur:.01+Math.random()*.03,hp:2500,bp:3000+Math.random()*4000,q:3,gain:.05+Math.random()*.12,pan:Math.random()*1.6-.8})}setTimeout(patter,40+Math.random()*70)}
// workshop sounds
function ratchet(){const n=6+Math.floor(Math.random()*9),pan=-.5+Math.random()*.4;room.classList.add('working');for(let i=0;i<n;i++){burst(A.bus.shop,{at:i*.055,dur:.025,hp:2200,gain:.32,pan});tone(A.bus.shop,{f:3100+Math.random()*300,at:i*.055,dur:.03,gain:.03,pan})}}
function impact(){const C=A.ctx,t=C.currentTime,d=.5+Math.random()*.8,pan=-.4;const o=C.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(70,t);o.frequency.linearRampToValueAtTime(52,t+d);
  const lfo=C.createOscillator();lfo.type='square';lfo.frequency.value=26;const lg=C.createGain();lg.gain.value=.5;const am=C.createGain();am.gain.value=.5;lfo.connect(lg).connect(am.gain);
  const f=C.createBiquadFilter();f.type='lowpass';f.frequency.value=900;const g=C.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.03);g.gain.setValueAtTime(.16,t+d-.05);g.gain.linearRampToValueAtTime(0,t+d);
  let out=g;if(C.createStereoPanner){const p=C.createStereoPanner();p.pan.value=pan;g.connect(p);out=p}
  o.connect(f).connect(am).connect(g);out.connect(A.bus.shop);o.start(t);lfo.start(t);o.stop(t+d+.05);lfo.stop(t+d+.05);
  burst(A.bus.shop,{dur:d,bp:1400,q:2,gain:.12,pan,attack:.03})}
function clank(){const pan=Math.random()*.8-.6,b=400+Math.random()*300;[1,2.27,3.8,5.4].forEach((m,i)=>tone(A.bus.shop,{f:b*m,dur:.6+Math.random()*.6-i*.08,gain:.07/(i+1),pan}))}
function airgun(){burst(A.bus.shop,{dur:.35+Math.random()*.4,hp:2500,lp:9000,gain:.12,pan:-.6,attack:.02})}
function shopLoop(){if(A.ctx&&!A.paused&&S.mode==='focus'&&A.ctx.state==='running'){const r=Math.random();if(r<.45)ratchet();else if(r<.68){impact();if(Math.random()<.5)setTimeout(()=>A.ctx&&impact(),900+Math.random()*700)}else if(r<.9)clank();else airgun()}setTimeout(shopLoop,3500+Math.random()*7000)}
// passing car on wet road
function passCar(){const C=A.ctx,t=C.currentTime,d=5.5,dir=Math.random()<.5?1:-1;
  const s=C.createBufferSource();s.buffer=A.white;s.loop=true;const s2=C.createBufferSource();s2.buffer=A.brown;s2.loop=true;
  const f=C.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(300,t);f.frequency.linearRampToValueAtTime(1600,t+d/2);f.frequency.linearRampToValueAtTime(300,t+d);
  const f2=C.createBiquadFilter();f2.type='lowpass';f2.frequency.value=260;
  const g=C.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.38,t+d/2);g.gain.linearRampToValueAtTime(0,t+d);
  let out=g;if(C.createStereoPanner){const p=C.createStereoPanner();p.pan.setValueAtTime(-.9*dir,t);p.pan.linearRampToValueAtTime(.9*dir,t+d);g.connect(p);out=p}
  const sg=C.createGain();sg.gain.value=.5;s.connect(f).connect(g);s2.connect(f2).connect(sg).connect(g);out.connect(A.bus.car);
  s.start(t,Math.random()*3);s2.start(t,Math.random()*3);s.stop(t+d+.1);s2.stop(t+d+.1);
  ['hl1','hl2'].forEach((id,i)=>{const el=document.getElementById(id);el.style.animationDirection=dir>0?'normal':'reverse';el.classList.remove('go');void el.getBoundingClientRect();setTimeout(()=>el.classList.add('go'),i*400)})}
function carLoop(){if(A.ctx&&!A.paused&&A.ctx.state==='running'&&S.vol.car>0)passCar();setTimeout(carLoop,12000+Math.random()*16000)}
function suspendAmb(p){A.paused=p;if(!A.ctx)return;Object.values(A.bus).forEach(g=>g.gain.setTargetAtTime(p?0:1*1,A.ctx.currentTime,.3));if(!p)Object.keys(A.bus).forEach(k=>A.bus[k].gain.setTargetAtTime(busVol(k),A.ctx.currentTime,.3))}
function chime(){if(!A.ctx)return;[[659.25,0],[523.25,.45]].forEach(([f,at])=>{tone(A.master,{f,at,dur:1.8,gain:.16,type:'sine'});tone(A.master,{f:f*2,at,dur:1,gain:.03,type:'sine'})})}
function uiBeep(f){if(!A.ctx||S.muted)return;tone(A.master,{f,dur:.08,gain:.05,type:'triangle'})}
function stampSound(){if(!A.ctx)return;burst(A.master,{dur:.12,lp:500,gain:.6});tone(A.master,{f:90,dur:.15,gain:.25})}
document.addEventListener('pointerdown',()=>{if(!A.ctx)initAudio()},{once:true});

/* mixer */
document.querySelectorAll('.mixer input').forEach(inp=>{const k=inp.dataset.k;inp.value=S.vol[k];
  inp.oninput=()=>{S.vol[k]=+inp.value;store.set('vol',S.vol);if(k==='music')audio.volume=S.vol.music/100;else if(A.ctx&&!A.paused)A.bus[k].gain.setTargetAtTime(busVol(k),A.ctx.currentTime,.1)}});
</script>
